<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>DualSub</title>
  <style>
    :root { --bg: #fff; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e3e3e3; --accent: #d9a400; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1e1e1e; --fg: #eee; --muted: #9a9a9a; --line: #333; --accent: #ffd84d; }
    }
    body { margin: 0; width: 290px; background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, "PingFang SC", sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 15px; }
    h1 span { color: var(--accent); }
    main { padding: 6px 14px 12px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; }
    .row + .row { border-top: 1px solid var(--line); }
    select, input[type=range] { width: 150px; }
    select { padding: 3px 4px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; }
    .hint { margin-top: 8px; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Dual<span>Sub</span></h1>
    <input type="checkbox" id="enabled" title="启用">
  </header>
  <main>
    <div class="row"><label for="targetLang">翻译成</label><select id="targetLang"></select></div>
    <div class="row"><label for="showOriginal">显示原文</label><input type="checkbox" id="showOriginal"></div>
    <div class="row"><label for="fontScale">字号</label><input type="range" id="fontScale" min="0.7" max="1.6" step="0.05"></div>
    <div class="hint">自动使用视频原语言的字幕；在 YouTube 按 C 可开关双语字幕。</div>
  </main>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
